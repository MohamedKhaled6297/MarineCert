- # ====== Authorization: ADMIN_AUTH ===========================
  id: 19371322376177471
  identification: 
    name: ADMIN_AUTH

  subscription: 
    version-number: 4865579

  authorization-scheme: 
    type: PL/SQL Function Returning Boolean

  settings: 
    pl/sql-function-body: |
      DECLARE
         v_count NUMBER;
      BEGIN
         SELECT 1
         INTO v_count
         FROM HR.TMGT_CARGO_USER
         WHERE UPPER(TCU_NAME) = UPPER(:APP_USER)
         AND TCU_ADMIN_AUTH = 'Y';
      
         RETURN TRUE;
      EXCEPTION
         WHEN NO_DATA_FOUND THEN
            RETURN FALSE;
      END;
      

  server-cache: 
    evaluation-point: Once per Session

