      type: SQL Query
      sql-query: |
        SELECT
            TC_CONTRACT_NO,
            TC_CERTIFICATE_NO,
            TC_INSURED_NAME,
            TC_INSURED_ADDRESS,
            TC_BENEFICIARY_NAME,
            TC_BENEFICIARY_ADDRESS,
            TC_LC_NO,
            TC_ACID_NO,
            TC_ISSUE_DATE,
            TC_FREIGHT_CURRENCY,
            TC_NET_PREMIUM,
            TC_P_STAMP,
            TC_CONTRACT_STAMP_DUTY,
            TC_SUP_FEE,
            TC_SERVICE_FEES,
            TC_P_H_GUARANTEE_FUND,
            TC_ISSUE_FEES,
            TC_GROSS_PREMIUM,
            TC_TOTAL_SUM_COVERS,
            TC_GOODS_DESCRIPTION,
            TC_INCO_TERMS,
            TC_ADD_INCOTERMS,
            TC_CONTAINER_NO,
            TC_NAME_OF_THE_VESSEL    CONVEYANCE_NAME,
            TC_HBL,
            TC_MBL,
            TC_VOYAGE_NO,
            TC_DEPARTURE_DATE,
            TC_PLACE_OF_LOADING,
            TC_PORT_OF_LOADING,
            TC_COUNTRY_FROM,
            TC_PORT_OF_ARRIVAL,
            TC_COUNTRY_TO,
            TC_FINAL_DESTINATION,
