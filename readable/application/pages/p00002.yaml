- # ====== Region: Certificate =================================
  id: 14915121376705011
  identification: 
    name: Certificate
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT TC_ID,
             TC_CONTRACT_NO,
             TC_CERTIFICATE_NO,
             TC_INSURED_NAME,
             TC_INSURED_ADDRESS,
             TC_INVOICE_VALUE,
             TC_NET_PREMIUM,
             TC_GROSS_PREMIUM,
             TC_TOTAL_SUM_COVERS,
       
             CASE NVL(TC_STATUS, 'I')
                 WHEN 'C' THEN
                     '<span class="cargo-status cargo-status--accepted">
                          Accepted
                      </span>'
      
                 WHEN 'R' THEN
                     '<span class="cargo-status cargo-status--rejected">
                          Rejected
                      </span>'
      
                 ELSE
                     '<span class="cargo-status cargo-status--incomplete">
                          Incomplete
                      </span>'
             END AS STATUS_DISPLAY,
      
             CASE
                 WHEN NVL(TC_STATUS, 'I') = 'I' THEN
                     '<button type="button"
                              class="cargo-action cargo-action--approve"
                              onclick="approveCertificate('
                              || TO_CHAR(TC_ID)
                              || ');">
                          Approve
                      </button>'
             END AS APPROVE_ACTION,
      
             CASE
                 WHEN NVL(TC_STATUS, 'I') = 'I' THEN
                     '<button type="button"
                              class="cargo-action cargo-action--reject"
                              onclick="rejectCertificate('
                              || TO_CHAR(TC_ID)
                              || ');">
                          Reject
                      </button>'
             END AS REJECT_ACTION
      
        FROM HR.TMGT_CARGO
       ORDER BY TC_ID DESC

  layout: 
