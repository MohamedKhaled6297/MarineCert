javascript: 
  function-and-global-variable-declaration: |
    function approveCertificate(tcId) {
    
        apex.message.confirm(
            "Are you sure you want to approve this certificate?",
            function (okPressed) {
    
                if (!okPressed) {
                    return;
                }
    
                apex.item("P2_TC_ID").setValue(tcId);
    
                apex.page.submit({
                    request: "APPROVE_CERTIFICATE",
                    showWait: true
                });
            }
        );
    }
    
    
    function rejectCertificate(tcId) {
    
        apex.message.confirm(
            "Are you sure you want to reject this certificate?",
            function (okPressed) {
    
                if (!okPressed) {
                    return;
                }
    
                apex.item("P2_TC_ID").setValue(tcId);
    
                apex.page.submit({
                    request: "REJECT_CERTIFICATE",
                    showWait: true
                });
            }
        );
    }

css: 
  inline: |
    /* Status badges */
    .cargo-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 92px;
        padding: 5px 14px;
        border: 1px solid;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
    }
    
    .cargo-status--accepted {
        color: #26763a;
        background: #ecf9ef;
        border-color: #82cc90;
    }
    
    .cargo-status--incomplete {
        color: #8a5b00;
        background: #fff8e1;
        border-color: #ffc84d;
    }
    
    .cargo-status--rejected {
        color: #c62828;
        background: #fff0f0;
        border-color: #ff9d9d;
    }
    
    
    /* Action buttons */
    .cargo-action {
        min-width: 82px;
        padding: 7px 13px;
        border: 1px solid;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s ease;
    }
    
    .cargo-action:hover {
        opacity: 0.82;
    }
    
    .cargo-action--approve {
        color: #ffffff;
        background: #2e8540;
        border-color: #2e8540;
    }
    
    .cargo-action--reject {
        color: #ffffff;
        background: #d32f2f;
        border-color: #d32f2f;
    }

