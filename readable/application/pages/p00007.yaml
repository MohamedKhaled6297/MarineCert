    language: PL/SQL
    pl/sql-code: |
      DECLARE
          L_FILE_BLOB     BLOB;
          L_FILE_NAME     VARCHAR2(500);
          L_BATCH_ID      NUMBER;
          L_TOTAL_ROWS    NUMBER := 0;
      BEGIN
          SELECT BLOB_CONTENT,
                 FILENAME
            INTO L_FILE_BLOB,
                 L_FILE_NAME
            FROM APEX_APPLICATION_TEMP_FILES
           WHERE NAME = :P7_FILE;
      
          INSERT INTO HR.TMGT_CARGO_UPLOAD_BATCH
          (
              CUB_CONTRACT_NO,
              CUB_FILE_NAME,
              CUB_STATUS,
              CUB_CR_USER,
              CUB_CR_DATE
          )
          VALUES
          (
              :P7_CONTRACT_NO,
              L_FILE_NAME,
              'UPLOADED',
              :APP_USER,
              SYSDATE
          )
          RETURNING CUB_ID INTO L_BATCH_ID;
      
          FOR R IN
          (
              SELECT *
                FROM TABLE
                (
                    APEX_DATA_PARSER.PARSE
                    (
                        P_CONTENT           => L_FILE_BLOB,
                        P_FILE_NAME         => L_FILE_NAME,
                        P_SKIP_ROWS         => 1,
                        P_DETECT_DATA_TYPES => 'N'
                    )
                )
          )
          LOOP
      
              IF     R.COL001 IS NULL
                 AND R.COL003 IS NULL
                 AND R.COL009 IS NULL
                 AND R.COL028 IS NULL
              THEN
                  CONTINUE;
              END IF;
      
              L_TOTAL_ROWS := L_TOTAL_ROWS + 1;
      
              INSERT INTO HR.TMGT_CARGO_UPLOAD_ROW
              (
                  CUR_BATCH_ID,
                  CUR_FILE_ROW_NO,
      
                  CUR_BENEFICIARY_NAME,
                  CUR_BENEFICIARY_ADDRESS,
                  CUR_ISSUE_DATE,
      
                  CUR_COUNTRY_FROM,
                  CUR_PORT_OF_LOADING,
                  CUR_PLACE_OF_LOADING,
                  CUR_VESSEL_NAME,
                  CUR_TRANSIT_MODE,
      
                  CUR_INVOICE_VALUE,
      
                  CUR_FREIGHT_YN,
                  CUR_FREIGHT_CURRENCY,
                  CUR_FREIGHT_CHARGE,
      
                  CUR_HBL,
                  CUR_MBL,
      
                  CUR_INCO_TERMS,
                  CUR_INCO_PERCENT,
      
                  CUR_LC_NO,
                  CUR_INVOICE_CURRENCY,
                  CUR_INVOICE_NO,
      
                  CUR_COUNTRY_TO,
                  CUR_PORT_OF_ARRIVAL,
                  CUR_FINAL_DESTINATION,
                  CUR_VOYAGE_NO,
                  CUR_DEPARTURE_DATE,
                  CUR_GOODS_DESCRIPTION,
      
                  CUR_ACID_NO,
                  CUR_CONTAINER_NO,
                  CUR_ISSUANCE_CURRENCY,
      
                  CUR_PROCESS_STATUS
              )
              VALUES
              (
                  L_BATCH_ID,
                  R.LINE_NUMBER,
      
                  TRIM(R.COL001),
                  TRIM(R.COL002),
                  TRIM(R.COL003),
      
                  TRIM(R.COL004),
                  TRIM(R.COL005),
                  TRIM(R.COL006),
