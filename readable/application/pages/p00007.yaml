    sql-query: |
      SELECT CUR_FILE_ROW_NO          AS ROW_NO,
      
             CASE CUR_PROCESS_STATUS
                 WHEN 'S' THEN
                     '<span class="cargo-status cargo-status--accepted">
                          Uploaded
                      </span>'
      
                 WHEN 'F' THEN
                     '<span class="cargo-status cargo-status--rejected">
                          Failed
