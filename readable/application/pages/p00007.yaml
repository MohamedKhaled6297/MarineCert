                  TRIM(R.COL008),
      
                  TRIM(R.COL009),
      
                  TRIM(R.COL010),
                  TRIM(R.COL011),
                  TRIM(R.COL012),
      
                  TRIM(R.COL013),
                  TRIM(R.COL014),
      
                  TRIM(R.COL015),
                  TRIM(R.COL016),
      
                  TRIM(R.COL017),
                  TRIM(R.COL018),
                  TRIM(R.COL019),
      
                  TRIM(R.COL020),
                  TRIM(R.COL021),
                  TRIM(R.COL022),
                  TRIM(R.COL023),
                  TRIM(R.COL024),
                  TRIM(R.COL025),
      
                  TRIM(R.COL026),
                  TRIM(R.COL027),
                  TRIM(R.COL028),
      
                  'P'
              );
          END LOOP;
      
          UPDATE HR.TMGT_CARGO_UPLOAD_BATCH
             SET CUB_TOTAL_ROWS = L_TOTAL_ROWS,
