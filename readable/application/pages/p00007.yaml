processes: 
- # ====== Process: DOWNLOAD_CARGO_TEMPLATE ====================
  id: 15172218031562724
  identification: 
    name: DOWNLOAD_CARGO_TEMPLATE
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          L_CONTEXT APEX_EXEC.T_CONTEXT;
          L_EXPORT  APEX_DATA_EXPORT.T_EXPORT;
      BEGIN
      
          /*==========================================================
            Cargo Certificate Excel Template
      
            This query generates:
            - Column headers
            - One example row
            - Text examples for values that may start with zero
          ==========================================================*/
      
          L_CONTEXT :=
              APEX_EXEC.OPEN_QUERY_CONTEXT
              (
                  P_LOCATION => APEX_EXEC.C_LOCATION_LOCAL_DB,
      
                  P_SQL_QUERY => q'~
                      SELECT
                          /*------------------------------------------
                            Beneficiary
                          ------------------------------------------*/
                          CAST('Example Beneficiary'
                               AS VARCHAR2(200))
                              AS BENEFICIARY_NAME,
      
                          CAST('Example Beneficiary Address'
                               AS VARCHAR2(500))
                              AS BENEFICIARY_ADDRESS,
      
      
                          /*------------------------------------------
                            Issue Date
                            Expected format: DD/MM/YYYY
                          ------------------------------------------*/
                          CAST('30/09/2026'
                               AS VARCHAR2(20))
                              AS ISSUE_DATE,
      
      
                          /*------------------------------------------
                            Country
                            Future Excel Dropdown
                          ------------------------------------------*/
                          CAST('062'
                               AS VARCHAR2(100))
                              AS COUNTRY_FROM,
      
      
                          CAST('Alexandria'
                               AS VARCHAR2(100))
                              AS PORT_OF_LOADING,
      
      
                          CAST('Cairo'
                               AS VARCHAR2(100))
                              AS PLACE_OF_LOADING,
      
      
                          /*------------------------------------------
                            Vessel
                          ------------------------------------------*/
                          CAST('Example Vessel'
                               AS VARCHAR2(100))
                              AS VESSEL_NAME,
      
      
                          CAST('SEA'
                               AS VARCHAR2(100))
                              AS TRANSIT_MODE,
      
      
                          /*------------------------------------------
                            Invoice
                          ------------------------------------------*/
                          CAST(10000 AS NUMBER)
                              AS INVOICE_VALUE,
      
      
                          /* 0 = No / 1 = Yes */
                          CAST('0'
                               AS VARCHAR2(1))
                              AS FREIGHT_YN,
      
      
                          /* Future Excel Dropdown */
                          CAST(null
                               AS VARCHAR2(100))
                              AS FREIGHT_CURRENCY,
      
      
                          CAST(null AS NUMBER)
                              AS FREIGHT_CHARGE,
      
      
                          /*------------------------------------------
                            Reference Numbers
      
                            Single quotation mark is intentional.
                            Example:
                            '001234567
      
                            This tells the user that leading zero
                            values must be treated as text.
                          ------------------------------------------*/
                          CAST('Test from XlS'
                               AS VARCHAR2(100))
                              AS HBL,
      
      
                          CAST('Test from XlS'
                               AS VARCHAR2(100))
                              AS MBL,
      
      
                          /*------------------------------------------
                            Incoterms
                          ------------------------------------------*/
                          CAST('CIF'
                               AS VARCHAR2(100))
                              AS INCO_TERMS,
      
      
                          CAST(10 AS NUMBER)
                              AS INCO_PERCENT,
      
      
                          /*------------------------------------------
                            LC Number
                          ------------------------------------------*/
                          CAST('001234567'
                               AS VARCHAR2(100))
                              AS LC_NO,
      
      
                          /*------------------------------------------
                            Invoice Currency
                            Future Excel Dropdown
                          ------------------------------------------*/
                          CAST('001'
                               AS VARCHAR2(100))
                              AS INVOICE_CURRENCY,
      
      
                          CAST('001234567'
                               AS VARCHAR2(100))
                              AS INVOICE_NO,
      
      
                          /*------------------------------------------
                            Destination Country
                            Future Excel Dropdown
                          ------------------------------------------*/
                          CAST('062'
                               AS VARCHAR2(100))
                              AS COUNTRY_TO,
      
      
                          CAST('New York'
                               AS VARCHAR2(100))
                              AS PORT_OF_ARRIVAL,
      
      
                          CAST('New York'
                               AS VARCHAR2(100))
                              AS FINAL_DESTINATION,
      
      
                          /*------------------------------------------
                            Voyage
                          ------------------------------------------*/
                          CAST('Test from XlS '
                               AS VARCHAR2(100))
                              AS VOYAGE_NO,
      
      
                          CAST('01/10/2026'
                               AS VARCHAR2(20))
                              AS DEPARTURE_DATE,
      
      
                          /*------------------------------------------
                            Goods
                          ------------------------------------------*/
                          CAST('Example Goods Description'
                               AS VARCHAR2(500))
                              AS GOODS_DESCRIPTION,
      
      
                          /*------------------------------------------
                            ACID / Container
      
                            Leading-zero examples
                          ------------------------------------------*/
                          CAST('Test from XlS '
                               AS VARCHAR2(100))
                              AS ACID_NO,
      
      
                          CAST('Test from XlS '
                               AS VARCHAR2(100))
                              AS CONTAINER_NO,
      
      
                          /*------------------------------------------
                            Issuance Currency
                            Future Excel Dropdown
                          ------------------------------------------*/
                          CAST('001'
                               AS VARCHAR2(100))
                              AS ISSUANCE_CURRENCY
      
                      FROM DUAL
                  ~'
              );
      
      
          /*==========================================================
            Generate XLSX
          ==========================================================*/
          L_EXPORT :=
              APEX_DATA_EXPORT.EXPORT
              (
                  P_CONTEXT   => L_CONTEXT,
                  P_FORMAT    => APEX_DATA_EXPORT.C_FORMAT_XLSX,
                  P_FILE_NAME => 'Cargo_Certificate_Template'
              );
      
      
          /*==========================================================
            Close Query Context
          ==========================================================*/
          APEX_EXEC.CLOSE(L_CONTEXT);
      
      
          /*==========================================================
            Download
          ==========================================================*/
          APEX_DATA_EXPORT.DOWNLOAD
          (
              P_EXPORT => L_EXPORT
          );
      
      
      EXCEPTION
          WHEN OTHERS THEN
      
              BEGIN
