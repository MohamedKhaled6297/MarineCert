---
# ====== Page: Home ==========================================
id: 1
identification: 
  name: Home
  alias: HOME
  title: Home

appearance: 
  page-mode: Normal
  page-template: Theme Default
  template-options: 
  - '#DEFAULT#'

navigation-menu: 
  override-user-interface-level: false

navigation: 
  cursor-focus: Do not focus cursor
  warn-on-unsaved-changes: true

css: 
  inline: |
    .t-HeroRegion-icon{
        background-color: white;
    }
    
    /* Change Card Body Background */
    .a-CardView-body {
    
        color: #d3af20 !important;
        font-weight: bold;
    }
    
    
    /* Make the circle perfectly centered */
    .a-CardView-initials {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }
    
    
    
    
    
    
    /**************************************************/
    /* Status badges */
    .cargo-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 92px;
        padding: 5px 14px;
        border: 1px solid;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
    }
    
    .cargo-status--accepted {
        color: #26763a;
        background: #ecf9ef;
        border-color: #82cc90;
    }
    
    .cargo-status--incomplete {
        color: #8a5b00;
        background: #fff8e1;
        border-color: #ffc84d;
    }
    
    .cargo-status--rejected {
        color: #c62828;
        background: #fff0f0;
        border-color: #ff9d9d;
    }
    
    
    /* Action buttons */
    .cargo-action {
        min-width: 82px;
        padding: 7px 13px;
        border: 1px solid;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s ease;
    }
    
    .cargo-action:hover {
        opacity: 0.82;
    }
    
    .cargo-action--approve {
        color: #ffffff;
        background: #2e8540;
        border-color: #2e8540;
    }
    
    .cargo-action--reject {
        color: #ffffff;
        background: #d32f2f;
        border-color: #d32f2f;
    }
    
    
    
    
    
    /* For Header */
    
    
    .marinecert-home-hero{
        display:flex;
        align-items:center;
        gap:28px;
        padding:30px 20px;
        flex-wrap:wrap;
    }
    
    .marinecert-home-logo{
        width:130px;
        max-width:100%;
        height:auto;
        display:block;
    }
    
    .marinecert-home-text h1{
        margin:0 0 18px 0;
        font-size:32px;
        font-weight:700;
        color:#000;
    }
    
    .marinecert-home-text h2{
        margin:0;
        font-size:28px;
        font-weight:700;
        color:#000;
    }
    
    @media (max-width: 768px){
        .marinecert-home-hero{
            gap:18px;
            padding:20px 10px;
        }
    
        .marinecert-home-logo{
            width:100px;
        }
    
        .marinecert-home-text h1{
            font-size:24px;
        }
    
        .marinecert-home-text h2{
            font-size:22px;
        }
    }

security: 
  authentication: Page Requires Authentication
  deep-linking: Application Default
  page-access-protection: Arguments Must Have Checksum
  form-auto-complete: Off
  browser-cache: Application Default

session-management: 
  rejoin-sessions: Application Default

advanced: 
  enable-duplicate-page-submissions: Yes - Enable page to be re-posted
  reload-on-submit: Only for Success

server-cache: 
  caching: Disabled

