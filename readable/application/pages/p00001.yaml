    automatic-refresh: 
      interval: 60

    advanced: 
      initialization-javascript-function: |
        function (options) {
        
            options.styleDefaults = options.styleDefaults || {};
        
            options.styleDefaults.colors = [
                "#28A745",   // Accepted
                "#FFC107",   // Incomplete
                "#DC3545"    // Rejected
            ];
        
            return options;
        }

    series: 
    - # ====== Series: New =========================================
      id: 15257646743036593
      identification: 
        name: New

      execution: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          Select *
          From
          (SELECT 1 AS SORT_ORDER,
                 'Accepted'   AS STATUS_NAME,
                 COUNT(*)     AS STATUS_COUNT
          FROM HR.TMGT_CARGO
          WHERE TC_STATUS = 'C'
          
          UNION ALL
          
          SELECT 2,
                 'Incomplete',
                 COUNT(*)
          FROM HR.TMGT_CARGO
          WHERE NVL(TC_STATUS, 'I') = 'I'
          
          UNION ALL
          
          SELECT 3,
                 'Rejected',
                 COUNT(*)
          FROM HR.TMGT_CARGO
          WHERE TC_STATUS = 'R'
          )
          ORDER BY SORT_ORDER

      order-by: 
        type: None

      column-mapping: 
        label: STATUS_NAME
        value: STATUS_COUNT
        custom-tooltip: STATUS_NAME
        custom-column: STATUS_NAME

      label: 
        show: true
        position: Automatic
        display-as: Label - Percentage ( Value )

