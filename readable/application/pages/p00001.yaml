- # ====== Region: Certificate Summary =========================
  id: 15257227512036589
  identification: 
    name: Certificate Summary
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      Select *
      From 
      (SELECT 1 AS SORT_ORDER,
             'Total Certificates' AS CARD_TITLE,
             TO_CHAR(COUNT(*)) AS CARD_VALUE,
             'fa-file-text-o' AS CARD_ICON
        FROM HR.TMGT_CARGO
      UNION ALL
      SELECT 2,
             'Incomplete',
             TO_CHAR(COUNT(*)),
             'fa-clock-o'
        FROM HR.TMGT_CARGO
       WHERE NVL(TC_STATUS, 'I') = 'I'
      UNION ALL
      SELECT 3,
             'Accepted',
             TO_CHAR(COUNT(*)),
             'fa-check-circle'
        FROM HR.TMGT_CARGO
       WHERE TC_STATUS = 'C'
      UNION ALL
      SELECT 4,
             'Rejected',
             TO_CHAR(COUNT(*)),
             'fa-times-circle'
        FROM HR.TMGT_CARGO
        WHERE TC_STATUS = 'R'
      UNION ALL
      
      SELECT 5,
             'This Month',
             TO_CHAR(COUNT(*)),
             'fa-calendar'
        FROM HR.TMGT_CARGO
       WHERE TC_ISSUE_DATE >= TRUNC(SYSDATE, 'MM')
         AND TC_ISSUE_DATE < ADD_MONTHS(TRUNC(SYSDATE, 'MM'), 1)
      )
      ORDER BY SORT_ORDER

  order-by: 
    type: None

  layout: 
    sequence: 20
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    - t-CardsRegion--hideHeader js-addHiddenHeadingRoleDesc
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: cert_summary
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 15257357060036590
    appearance: 
      layout: Grid
      grid-columns: 5 Columns

    title: 
      advanced-formatting: false
      column: CARD_TITLE

    subtitle: 
      advanced-formatting: false

    body: 
      advanced-formatting: false
      column: CARD_VALUE

    secondary-body: 
      advanced-formatting: false

    icon-and-badge: 
      icon-source: Icon Class
      icon-css-classes: fa &CARD_ICON.
      icon-position: Start

    media: 
      advanced-formatting: false
