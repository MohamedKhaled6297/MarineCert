- # ====== Dynamic Action: AUTO_REFRESH_DASHBOARD ==============
  id: 15261231601036629
  identification: 
    name: AUTO_REFRESH_DASHBOARD

  execution: 
    sequence: 10
    event-scope: Static

  when: 
    event: Page Load

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 15261363977036630
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        (function () {
        
            const normalRegions = [
                "cert_summary",
                "cert_status",
                "cert_monthly",
                "financial_summary",
                "recent_bulk"
            ];
        
            function refreshHomeDashboard() {
        
                if (document.visibilityState !== "visible") {
                    return;
                }
        
                const currentScroll =
                    window.scrollY ||
                    document.documentElement.scrollTop;
        
                const refreshPromises = [];
        
                /* Refresh Cards / Charts */
                normalRegions.forEach(function (regionId) {
        
                    const region = apex.region(regionId);
        
                    if (region &&
                        typeof region.refresh === "function") {
        
                        refreshPromises.push(
                            Promise.resolve(region.refresh())
                        );
                    }
                });
        
        
                /* Interactive Report */
                const irRegion =
                    apex.region("recent_certificates");
        
                if (irRegion &&
                    typeof irRegion.refresh === "function") {
        
                    refreshPromises.push(
                        Promise.resolve(
                            irRegion.refresh(true)
                        )
                    );
                }
        
        
                Promise.allSettled(refreshPromises)
                    .then(function () {
        
                        requestAnimationFrame(function () {
        
                            window.scrollTo({
                                top: currentScroll,
                                left: 0,
                                behavior: "auto"
                            });
        
                        });
        
                    });
            }
        
        
            if (window.homeDashboardRefreshTimer) {
        
                clearInterval(
                    window.homeDashboardRefreshTimer
                );
            }
        
        
            window.homeDashboardRefreshTimer =
                setInterval(
                    refreshHomeDashboard,
                    30000
                );
        
        })();

    execution: 
      sequence: 10
      event: AUTO_REFRESH_DASHBOARD # 15261231601036629
      fire-when-event-result-is: True
      fire-on-initialization: false

