- # ====== Region: Financial Summary ===========================
  id: 15258504539036601
  identification: 
    name: Financial Summary
    title: Financial Summary
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      Select *
      From
      (SELECT 1 SORT_ORDER,
             'Total Sum Covers' CARD_TITLE,
             TO_CHAR(
                 NVL(SUM(TC_TOTAL_SUM_COVERS), 0),
                 'FM999G999G999G999G990D00'
             ) CARD_VALUE,
             'fa-shield' CARD_ICON
      FROM HR.TMGT_CARGO
      WHERE NVL(TC_STATUS, 'I') <> 'R'
      
      UNION ALL
      
      SELECT 2,
             'Net Premium',
             TO_CHAR(
                 NVL(SUM(TC_NET_PREMIUM), 0),
                 'FM999G999G999G999G990D00'
             ),
             'fa-money'
      FROM HR.TMGT_CARGO
      WHERE NVL(TC_STATUS, 'I') <> 'R'
      
      UNION ALL
      
      SELECT 3,
             'Gross Premium',
             TO_CHAR(
                 NVL(SUM(TC_GROSS_PREMIUM), 0),
                 'FM999G999G999G999G990D00'
             ),
             'fa-line-chart'
      FROM HR.TMGT_CARGO
      WHERE NVL(TC_STATUS, 'I') <> 'R'
      )
      ORDER BY SORT_ORDER

  order-by: 
    type: None

  layout: 
    sequence: 50
    parent-region: No Parent
