      initialization-javascript-function: |
        function (options) {
        
            options.styleDefaults = options.styleDefaults || {};
        
            options.styleDefaults.colors = [
                "#28A745",   // Accepted
                "#FFC107",   // Incomplete
                "#DC3545"    // Rejected
            ];
        
            return options;
        }

    series: 
    - # ====== Series: New =========================================
      id: 15258194324036598
      identification: 
        name: New

      execution: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          SELECT TRUNC(TC_ISSUE_DATE, 'MM') AS MONTH_DATE,
          
                 TO_CHAR(
                     TRUNC(TC_ISSUE_DATE, 'MM'),
                     'MON YYYY'
                 ) AS MONTH_NAME,
          
                 COUNT(*) AS CERTIFICATE_COUNT
          
          FROM HR.TMGT_CARGO
          
          WHERE TC_ISSUE_DATE >=
                ADD_MONTHS(TRUNC(SYSDATE, 'MM'), -11)
          
          GROUP BY TRUNC(TC_ISSUE_DATE, 'MM')
          
          ORDER BY MONTH_DATE

      order-by: 
        type: None

      column-mapping: 
        label: MONTH_NAME
        value: CERTIFICATE_COUNT

      appearance: 
        assigned-to-y2-axis: false

      label: 
        show: true
        position: Automatic

