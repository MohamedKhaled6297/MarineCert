- # ====== Region: Recent Certificates =========================
  id: 15258668147036603
  identification: 
    name: Recent Certificates
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT *
      FROM
      (
          SELECT
              TC_ID,
              TC_CERTIFICATE_NO,
              TC_CONTRACT_NO,
              TC_INSURED_NAME,
              TC_ISSUE_DATE,
              TC_TOTAL_SUM_COVERS,
              TC_NET_PREMIUM,
              TC_GROSS_PREMIUM,
      
              CASE NVL(TC_STATUS, 'I')
                  WHEN 'C' THEN
                      '<span class="cargo-status cargo-status--accepted">
                          Accepted
                       </span>'
      
                  WHEN 'R' THEN
                      '<span class="cargo-status cargo-status--rejected">
                          Rejected
                       </span>'
      
                  ELSE
                      '<span class="cargo-status cargo-status--incomplete">
                          Incomplete
                       </span>'
              END AS STATUS_DISPLAY
      
          FROM HR.TMGT_CARGO
      
          ORDER BY TC_ID DESC
      )
      WHERE ROWNUM <= 10

  layout: 
