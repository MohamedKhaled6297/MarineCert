- # ====== Page Item: P6_CERTIFICATE_NO ========================
  id: 15169344941562696
  identification: 
    name: P6_CERTIFICATE_NO
    type: Popup LOV

  label: 
    label: Certificate No
    alignment: Left

  settings: 
    display-as: Inline Popup
    initial-fetch: Automatic
    manual-entry: false
    fetch-on-search: false

  search: 
    match-type: Contains
    case-sensitive: false
    minimum-characters: 0

  multiple-values: 
    type: No

  layout: 
    sequence: 10
    region: Extract Certificate Reports # 15169237101562695
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: false
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Optional - Floating
    template-options: 
    - '#DEFAULT#'
    width: 30

  validation: 
    value-required: false

  list-of-values: 
    type: SQL Query
    sql-query: |
      SELECT TC_CERTIFICATE_NO
             || ' / '
             || TC_INSURED_NAME AS DISPLAY_VALUE,
      
             TC_CERTIFICATE_NO  AS RETURN_VALUE
      FROM HR.TMGT_CARGO
      WHERE TC_CERTIFICATE_NO IS NOT NULL
      AND TC_STATUS = 'C'
      ORDER BY TC_ID DESC
    display-extra-values: true
    display-null-value: true

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Null
    used: Only when current value in session state is null

  session-state: 
