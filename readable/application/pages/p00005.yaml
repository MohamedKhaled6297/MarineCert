processes: 
- # ====== Process: Set Manual Lock Audit ======================
  id: 4402799905369925
  identification: 
    name: Set Manual Lock Audit
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          L_OLD_LOCK HR.TMGT_CARGO_USER.TCU_LOCK%TYPE;
      BEGIN
      
          /* Get current value from database before APEX updates the row */
          SELECT NVL(TCU_LOCK, 'N')
            INTO L_OLD_LOCK
            FROM HR.TMGT_CARGO_USER
           WHERE TCU_ID = :P5_TCU_ID;
      
      
          /* Manual Lock: N -> Y */
          IF L_OLD_LOCK = 'N'
             AND :P5_TCU_LOCK = 'Y'
          THEN
      
              :P5_TCU_DISABLE_USER := :APP_USER;
      
              :P5_TCU_DISABLE_DATE :=
                  TO_CHAR(
                      SYSDATE,
                      'DD/MM/RRRR HH:MI:SS AM'
                  );
      
          END IF;
      
      END;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

