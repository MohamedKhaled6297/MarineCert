- # ====== Dynamic Action: Fix Container Floating Label ========
  id: 15048753088125400
  identification: 
    name: Fix Container Floating Label

  execution: 
    sequence: 50
    event-scope: Static

  when: 
    event: Page Load

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 15048899382125401
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        (function ($) {
        
            const item = document.getElementById(
                "P3_TC_CONTAINER_NO"
            );
        
            // التوقف بهدوء لو العنصر غير موجود
            if (!item) {
                return;
            }
        
            const $item = $(item);
        
            const $container = $item.closest(
                ".t-Form-fieldContainer"
            );
        
            function syncFloatingLabel() {
        
                const hasValue =
                    $.trim($item.val() || "").length > 0;
        
                const hasFocus =
                    document.activeElement === item;
        
            
                $container.toggleClass(
                    "js-show-label",
                    hasValue || hasFocus
                );
            }
        
            $item.off(".containerNoFloating");
        
        
            $item.on(
                "focusin.containerNoFloating " +
                "input.containerNoFloating " +
                "change.containerNoFloating",
                syncFloatingLabel
            );
        
            $item.on(
                "focusout.containerNoFloating",
                function () {
                    setTimeout(syncFloatingLabel, 0);
                }
            );
        
         
            syncFloatingLabel();
        
        })(apex.jQuery);

    execution: 
      sequence: 10
      event: Fix Container Floating Label # 15048753088125400
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Get Issuance Exchange Rate ==========
  id: 15049359665125406
  identification: 
    name: Get Issuance Exchange Rate

  execution: 
    sequence: 60
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P3_TC_ISSUANCE_CURRENCY

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 15049429595125407
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        (function () {
        
            const currencyCode = apex.item("P3_TC_ISSUANCE_CURRENCY").getValue();
            const rateItem = apex.item("P3_TC_ISSUANCE_EX_RATE");
        
            if (!currencyCode) {
                rateItem.setValue("");
                return;
            }
        
        
            rateItem.setValue("");
        
            apex.server.process(
                "GET_ISSUANCE_EX_RATE",
                {
                    x01: currencyCode
                },
                {
                    dataType: "json",
                    loadingIndicator: "#P3_TC_ISSUANCE_EX_RATE",
        
                    success: function (data) {
        
                        if (data.success) {
        
                            rateItem.setValue(data.exchangeRate );
                            calculateCargoValues();  // Added from Mohamed Khaled
        
                        } else {
        
                            rateItem.setValue("");
        
                            apex.message.alert(
                                data.message ||
                                "Failed to retrieve exchange rate."
                            );
                        }
                    },
        
                    error: function (
                        jqXHR,
                        textStatus,
                        errorThrown
                    ) {
                        rateItem.setValue("");
        
                        console.error(
                            jqXHR.responseText
                        );
        
                        apex.message.alert(
                            "Error retrieving exchange rate: " +
                            (errorThrown || textStatus)
                        );
                    }
                }
            );
        })();

    execution: 
      sequence: 10
      event: Get Issuance Exchange Rate # 15049359665125406
      fire-when-event-result-is: True
      fire-on-initialization: false

