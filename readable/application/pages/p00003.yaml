          L_GUARANTEE_FUND         NUMBER;
          L_ISSUE_FEES             NUMBER;
          L_GROSS_PREMIUM          NUMBER;
      BEGIN
          HR.PKG_CARGO_CALC.CALCULATE
          (
              P_INVOICE_VALUE        => NVL(:P3_TC_INVOICE_VALUE, 0),
              P_FREIGHT_YN           => NVL(:P3_TC_FREIGHT_YN, '0'),
              P_FREIGHT_CHARGE       => NVL(:P3_TC_FREIGHT_CHARGE, 0),
