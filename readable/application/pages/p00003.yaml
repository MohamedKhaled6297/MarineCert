- # ====== Dynamic Action: Generate Certificate Number =========
  id: 14632521784375636
  identification: 
    name: Generate Certificate Number

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: Item(s)
    item(s): 
    - P3_TC_CONTRACT_NO

  client-side-condition: 
    type: Item is not null
    item: P3_TC_CONTRACT_NO

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 14632566664375637
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        (function () {
            const contractNo = apex.item("P3_TC_CONTRACT_NO").getValue();
            const createButton = apex.jQuery("#BTN_CREATE");
        
            if (!contractNo) {
                apex.item("P3_TC_CERTIFICATE_NO").setValue("");
                return;
            }
        
            createButton.prop("disabled", true);
        
            apex.item("P3_TC_CERTIFICATE_NO").setValue("");
        
            apex.server.process(
                "GET_NEXT_CERTIFICATE_NO",
                {
                    x01: contractNo
                },
                {
                    dataType: "json",
                    loadingIndicator: "#P3_TC_CERTIFICATE_NO",
        
                    success: function (data) {
                        if (data.success) {
                            apex.item("P3_TC_CERTIFICATE_NO")
                                .setValue(data.certificateNo);
                            apex.item("P3_TC_INSURED_NAME")
                                .setValue(data.insuredName);
        
                            apex.item("P3_TC_INSURED_ADDRESS")
                                .setValue(data.insuredAddress);
        
                            apex.item("P3_TC_COVER_RATE")
                                .setValue(data.cover_rate || "");
        
                            calculateCargoValues();
                        } else {
                            apex.item("P3_TC_CERTIFICATE_NO").setValue("");
                            apex.item("P3_TC_INSURED_NAME").setValue("");
                            apex.item("P3_TC_INSURED_ADDRESS").setValue("");
                            apex.item("P3_TC_COVER_RATE").setValue("");
        
                            apex.message.alert(
                                data.message || "Failed to generate certificate number."
                            );
                        }
                    },
        
                    error: function (jqXHR, textStatus, errorThrown) {
                        console.error(jqXHR.responseText);
        
                        apex.message.alert(
                            "Error generating Certificate No: " +
                            (errorThrown || textStatus)
                        );
                    },
        
                    complete: function () {
                        createButton.prop("disabled", false);
                    }
                }
            );
        })();

    execution: 
      sequence: 10
      event: Generate Certificate Number # 14632521784375636
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Refresh Policy Limit Cards ==================
    id: 15169091425562693
    identification: 
      name: Refresh Policy Limit Cards
      action: Refresh

    settings: 
      maintain-pagination: false

    affected-elements: 
