                }
        
                return;
            }
        
        
            rateItem.setValue("");
        
            apex.server.process(
                "GET_FREIGHT_EX_RATE",
                {
                    x01: currencyCode
                },
                {
                    dataType: "json",
        
                    loadingIndicator: "#P3_TC_FREIGHT_EX_RATE",
        
                    success: function (data) {
        
                        if (data.success) {
        
                            rateItem.setValue(data.exchangeRate);
        
                            if (
                                typeof calculateCargoValues === "function"
                            ) {
                                calculateCargoValues();
                            }
        
                        } else {
        
                            rateItem.setValue("");
        
                            apex.message.alert(
