  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          L_FREIGHT_FINAL          NUMBER;
          L_ADD_INCOTERMS          NUMBER;
          L_INCO_VALUE             NUMBER;
          L_TOTAL_SHIPMENT_VALUE   NUMBER;
          L_TOTAL_SUM_COVERS       NUMBER;
