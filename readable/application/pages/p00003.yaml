    settings: 
      code: |
        (function () {
        
            const freightYN = apex.item("P3_TC_FREIGHT_YN").getValue();
            const currencyCode = apex.item("P3_TC_FREIGHT_CURRENCY").getValue();
            const rateItem = apex.item("P3_TC_FREIGHT_EX_RATE");
        
