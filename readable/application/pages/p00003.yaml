    function clearCargoCalculatedValues() {
    
        [
            "P3_TC_FREIGHT_FINAL",
            "P3_TC_ADD_INCOTERMS",
            "P3_TC_INCO_VALUE",
            "P3_TC_TOTAL_SHIPMENT_VALUE",
