                            );
                        }
                    },
        
                    error: function (
                        jqXHR,
                        textStatus,
                        errorThrown
                    ) {
                        rateItem.setValue("");
        
                        console.error(
                            jqXHR.responseText
                        );
        
                        apex.message.alert(
                            "Error retrieving Freight Exchange Rate: "
                            + (errorThrown || textStatus)
                        );
                    }
                }
            );
        
        })();

    execution: 
      sequence: 10
      event: Get Freight Exchange Rate # 15168555926562688
      fire-when-event-result-is: True
      fire-on-initialization: false

