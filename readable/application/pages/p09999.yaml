- # ====== Dynamic Action: Verify User =========================
  id: 11021704926607527
  identification: 
    name: Verify User

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: LOGIN # 25664625283156909

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 11021819145607528
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        apex.message.clearErrors();
        
        let btn = document.getElementById("loginBtn");
        btn.disabled = true;
        btn.innerText = "Please wait...";
        btn.style.color = "yellow";
        
        apex.server.process(
            'VERIFY_USER',
            {
                x01 : $v('P9999_USERNAME'),
                x02 : $v('P9999_PASSWORD')
            },
            {
                dataType: 'json',
                success: function(pData){
                    
                    if(pData[0].MSG === 'SUCCESS'){
                        btn.disabled = false;
                        btn.innerText = "Login";
                        btn.style.color = "";
                        $('#verify-otp').dialog('open');
                        sendOtp2User();
                    }
                    else{
                        apex.message.showErrors(
                            [
                                {
                                    type: 'error',
                                    message: pData[0].MSG,
                                    location: 'page',
                                    unsafe: false
                                }
                            ]
                        );
                        setTimeout(function(){
                            btn.disabled = false;
                            btn.innerText = "Login";
                            btn.style.color = "";
                        }, 2000);
                    }
                }
            }
        )
        
        

    execution: 
      sequence: 10
      event: Verify User # 11021704926607527
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Move Focuse =========================
  id: 13789386281452497
  identification: 
    name: Move Focuse

  execution: 
    sequence: 30
    event-scope: Static

  when: 
    event: Page Load

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 13789466192452498
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        const otpInputs = [
            "P9999_OTP_CHAR_1",
            "P9999_OTP_CHAR_2",
            "P9999_OTP_CHAR_3",
            "P9999_OTP_CHAR_4",
            "P9999_OTP_CHAR_5",
            "P9999_OTP_CHAR_6"
        ];
        
        // Auto move forward
        otpInputs.forEach((item, index) => {
            const el = document.getElementById(item);
        
            el.addEventListener("input", function () {
                if (this.value.length === 1) {
                    if (index < otpInputs.length - 1) {
                        document.getElementById(otpInputs[index + 1]).focus();
                    } else {
           
                        this.blur(); // optional
                    }
                }
            });
        
            // Backspace 
            el.addEventListener("keydown", function (e) {
                if (e.key === "Backspace" && this.value === "" && index > 0) {
                    document.getElementById(otpInputs[index - 1]).focus();
                }
            });
        });
        
        
        //  Paste + focus 
        
        // paste على أي input
        otpInputs.forEach((item, index) => {
            const el = document.getElementById(item);
        
            el.addEventListener("paste", function (e) {
                let pasteData = (e.clipboardData || window.clipboardData).getData("text");
        
                if (!pasteData) return;
        
                pasteData = pasteData.trim().replace(/\s+/g, "");
        
                let currentIndex = index; 
                let maxLength = otpInputs.length;
        
                let lastFilledIndex = currentIndex;
        
                for (let i = 0; i < pasteData.length; i++) {
                    if (currentIndex + i >= maxLength) break;
        
                    let targetId = otpInputs[currentIndex + i];
                    document.getElementById(targetId).value = pasteData[i];
        
                    lastFilledIndex = currentIndex + i;
                }
        
              
                // if (lastFilledIndex < maxLength - 1) {
                //     document.getElementById(otpInputs[lastFilledIndex + 1]).focus();
                // } else {
                //     document.getElementById(otpInputs[lastFilledIndex]).focus();
                // }
                if (lastFilledIndex < maxLength - 1) {
                    document.getElementById(otpInputs[lastFilledIndex + 1]).focus();
                } else {
                    setTimeout(() => {
                        document.activeElement.blur();
                    }, 0);
                }
        
                e.preventDefault();
            });
        });

    execution: 
      sequence: 10
      event: Move Focuse # 13789386281452497
      fire-when-event-result-is: True
      fire-on-initialization: false

